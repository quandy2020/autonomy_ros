/**:
  ros__parameters:
    scene_data_path: ""
    scene_id: ""
    mp3d_root: ""
    scene_dataset_config: ""
    package_scene_dataset_config: ""

    # RGB / depth / semantic share resolution; 1280×720 + narrower FOV for sharper views.
    image_width: 1280
    image_height: 720
    camera_horizontal_fov_deg: 70.0
    sensor_height: 0.6

    agent_pose_topic: "habitat/agent_pose"
    set_agent_pose_topic: "habitat/set_agent_pose"
    agent_pose_frame: "map"
    map_frame: "map"
    odom_frame: "odom"
    base_footprint_frame: "base_footprint"
    base_link_height: 0.01
    rgb_camera_frame: "camera_optical_frame"
    depth_camera_frame: "camera_optical_frame"
    semantic_camera_frame: "camera_optical_frame"
    odom_topic: "odom"
    cmd_vel_topic: "cmd_vel"
    cmd_vel_timeout: 1.0

    rgb_topic: "camera/rgb/image_raw"
    rgb_camera_info_topic: "camera/rgb/camera_info"
    depth_topic: "camera/depth/image_raw"
    semantic_topic: "camera/semantic/image_raw"

    # Extra COLOR pass each tick; keep false unless debugging overview (launch can override).
    topdown_enabled: false
    topdown_topic: "camera/topdown/image_raw"
    topdown_camera_info_topic: "camera/topdown/camera_info"
    topdown_frame: "map"
    # room: ortho full-scene; oblique/overhead: follow robot; interactive: RViz 6-DOF marker
    topdown_mode: "room"
    topdown_width: 640
    topdown_height: 480
    topdown_height_m: 8.0
    topdown_distance_m: 7.0
    topdown_look_ahead_m: 3.0
    topdown_look_at_height_m: 1.2
    topdown_hfov_deg: 90.0
    topdown_room_margin: 1.18
    topdown_ortho_scale: 0.0

    # Empty: {scene_dir}/{scene_id}_semantic.ply (MP3D dataset semantic mesh).
    semantic_ply_path: ""
    semantic_pointcloud_topic: "semantic_pointcloud"
    semantic_pointcloud_frame: "map"
    semantic_pointcloud_downsample: 1
    semantic_pointcloud_rate_hz: 0.0

    occupancy_grid_topic: "map"
    occupancy_grid_frame: "map"
    occupancy_grid_resolution: 0.05
    # PLY fallback slice when building /map without .navmesh.
    occupancy_grid_z_min: 0.0
    occupancy_grid_z_max: 0.55
    occupancy_grid_downsample: 1
    occupancy_grid_rate_hz: 0.0

    navmesh_topic: "habitat/graph"
    navmesh_mesh_topic: "habitat/navmesh_mesh"
    navmesh_frame: "map"
    navmesh_topology: "triangle"
    navmesh_rate_hz: 0.0
    navmesh_meters_per_pixel: 0.4
    navmesh_height: 0.0
    navmesh_eps: 0.5
    navmesh_stride: 2
    navmesh_z: 0.05
    navmesh_max_nodes: 20000
    navmesh_node_scale: 0.08
    navmesh_line_width: 0.03
    navmesh_show_nodes: true
    navmesh_show_edges: true
    navmesh_show_mesh: false
    navmesh_show_faces: true
    navmesh_face_alpha: 0.18
    navmesh_color_by_island: true
    navmesh_connect_diagonal: false

    # Lower sim rate offsets 3-sensor 720p GPU cost vs former 640×480 @ 30 Hz.
    update_rate_hz: 20.0

    spawn_mode: fixed
    spawn_index: 0
    spawn_count: 1
    spawn_seed: 0
    spawn_x: 0.0
    spawn_y: 0.0
    spawn_yaw: 0.0

    pedestrians_enabled: false
    pedestrian_count: 5
    pedestrian_goal_count: 4
    pedestrian_linear_speed: 1.0
    pedestrian_angular_speed: 1.5
    pedestrian_dist_thresh: 0.5
    pedestrian_turn_thresh: 0.3
    pedestrian_waypoint_min_dist: 3.0
    pedestrian_robot_activate_dist: -1.0
    pedestrian_avoid_dist: 2.0
    pedestrian_spawn_min_robot_dist: 2.5
    pedestrian_radius: 0.35
    pedestrian_height: 1.7
    pedestrian_seed: 0
    pedestrians_tracked_topic: "pedestrian_visualizer/tracked_persons"
    pedestrians_viz_topic: "pedestrian_simulator/visualization"
    trackvla_root: ""
    # Empty: auto from autonomy_lerobot/config/data_paths.yaml
    # (/mnt/data4t/Datasets/humanoids/humanoids/humanoid_data)
    humanoid_data_root: ""
    humanoid_avatar: "female_2"
    # Comma-separated types (female_2,male_0,...); empty = all folders under humanoid_data_root
    humanoid_avatars: ""
    humanoid_infos_json: ""
    pedestrian_semantic_id: 250
    dynamic_actor_kind: "humanoid"
    # New split-agent mode: humans and robots can coexist and move independently.
    # If both counts stay 0, legacy pedestrians_enabled + pedestrian_count +
    # dynamic_actor_kind still work as before.
    human_agent_count: 0
    human_agent_goal_count: 4
    human_agent_linear_speed: 1.0
    human_agent_seed: 0
    human_agents_tracked_topic: "pedestrian_visualizer/tracked_persons"
    human_agents_viz_topic: "pedestrian_simulator/visualization"
    # Empty: auto from autonomy_simulator/urdf
    robot_asset_root: ""
    robot_asset_type: "turtlebot3_waffle"
    # Comma-separated types (turtlebot3_waffle,turtlebot3_waffle_gps,...)
    robot_asset_types: ""
    # Exact per-type counts, e.g. "spot=2,jackal=1". Higher priority than robot_asset_types.
    robot_asset_counts: ""
    # Per-type defaults are built in for turtlebot3 / jackal / husky / stretch.
    # Fallbacks below are used for unknown robot types.
    robot_semantic_id: 251
    robot_agent_count: 0
    robot_agent_goal_count: 4
    robot_agent_linear_speed: 1.0
    robot_agent_seed: 0
    robot_agents_tracked_topic: "robot_agent_visualizer/tracked_persons"
    robot_agents_viz_topic: "robot_simulator/visualization"
    # False: show robots in RViz mainly via RobotModel instead of debug mesh markers.
    robot_agents_debug_mesh_viz: false
    # Comma-separated per-type overrides, e.g. "jackal=0.32,husky=0.45"
    robot_radius_overrides: ""
    robot_height_overrides: ""
    robot_semantic_id_overrides: ""
