autonomy_node:
  ros__parameters:
    autonomy:
      config_directory: ""
      config_file: autonomy.lua
      enable_bt_tasks: true
      use_bt_navigation: true
      map_topic: map
      publish_map: true
      tf_topic: /tf
      tf_static_topic: /tf_static
      odom_topic: odom
      cmd_vel_topic: cmd_vel
      enable_scan_bridge: true
      scan_topic: /scan
      publish_costmaps: true
      costmap_publish_hz: 1.0
      publish_diagnostics: true
      sensor_bridge:
        point_cloud_enabled: false
        point_cloud_topic: /points
        range_enabled: false
        range_topic: /range
      planner:
        planner_id: NavFn
        global_frame: odom
      controller:
        controller_id: MPCController
        goal_checker_id: goal_checker
        progress_checker_id: progress_checker
        max_linear_vel: 0.22
        max_angular_vel: 1.5
        goal_tolerance: 0.15
        lookahead: 0.3
        base_frame: base_footprint

    navigation:
      waypoint_timeout_sec: 120.0
      init_pose_topic: initialpose
      goal_pose_topic: goal_pose

    visualization:
      frame_id: odom
