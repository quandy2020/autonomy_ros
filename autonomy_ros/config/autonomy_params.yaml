autonomy_node:
  ros__parameters:
    # use_sim_time: set from launch (autonomy_stack.launch.py), not here — avoids double-declare

    autonomy:
      # Set by autonomy_stack.launch.py (autonomy_config_directory); do not rely on empty default.
      config_directory: ""
      config_file: autonomy.lua
      enable_bt_tasks: true
      use_bt_navigation: true
      map_topic: "map"
      publish_map: true
      tf_topic: "/tf" 
      tf_static_topic: "/tf_static"
      odom_topic: "odom"
      cmd_vel_topic: "cmd_vel"
      cmd_vel_teleop_topic: "cmd_vel_teleop"
      enable_scan_bridge: true
      scan_topic: "/scan"
      publish_costmaps: true
      costmap_publish_hz: 1.0
      publish_diagnostics: true

      sensor_bridge:
        point_cloud_enabled: false
        point_cloud_topic: "/points"
        range_enabled: false
        range_topic: "/range"
        image_enabled: false
        image_topic: "/camera/image_raw"
        imu_enabled: false
        imu_topic: "/imu"

      planner:
        # Empty string: use PlannerServer default (see autonomy.lua).
        planner_id: "NavFn"
        # Must match TF tree and autonomy lua AUTONOMY_COMMON.global_frame for map-based nav.
        # Use "odom" for Gazebo sim without AMCL; use "map" when map->odom TF is published.
        global_frame: "odom"
        waypoint_spacing: 0.1

      controller:
        controller_id: "MPCController"
        goal_checker_id: "goal_checker"
        progress_checker_id: "progress_checker" 
        max_linear_vel: 0.22
        max_angular_vel: 1.5
        goal_tolerance: 0.15
        lookahead: 0.3
        base_frame: "base_footprint"

    task:
      battery_percent: 100.0

    command:
      default_dock_id: dock_main
      waypoint_timeout_sec: 120.0
      init_pose_topic: "init_pose"
      goal_pose_topic: "goal_pose"
      enable_follow_detections: true
      follow_detections_topic: "/detections_3d"
      dock_x: 0.5
      dock_y: 0.0
      dock_w: 1.0

    visualization:
      frame_id: "odom"
