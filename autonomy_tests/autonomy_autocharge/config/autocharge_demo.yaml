# Shared charger / predock pose in map frame (canonical defaults for all nodes below).
# Launch pose args (charger_*, predock_*) default to empty -> these yaml values apply.
# Robot spawn: spawn_mode/fixed spawn_x/y/yaw via launch file.
charger_markers_node:
  ros__parameters:
    map_frame: map
    marker_topic: /autocharge_demo/markers
    charger_x: 2.2
    charger_y: 0.0
    charger_yaw: 3.1415926
    use_explicit_predock: true
    predock_x: 1.4
    predock_y: -0.08
    predock_yaw: 0.0
    predock_distance_m: 0.8
    publish_hz: 2.0

station_ir_sim:
  ros__parameters:
    map_frame: map
    base_frame: base_footprint
    dock_frame: dock
    publish_dock_tf: true
    charger_x: 2.2
    charger_y: 0.0
    charger_yaw: 3.1415926
    update_hz: 20.0
    marker_topic: /env_sim/markers
    charge_topic: /dock/charge_connected
    ir_sensors.topic: /ir/dock
    ir_sensors.publish: true
    ir_sensors.swap_channels: true
    ir_sensors.use_dock_emitters: true
    station_visualize: true
    charge_success_dist_m: 0.038
    charge_success_yaw_tol_deg: 8.0
    charge_hold_s: 0.20
    robot_length_m: 0.30
    robot_width_m: 0.40

autocharge_demo_node:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    navigate_to_pose_action: /navigate_to_pose
    dock_to_charger_action: /dock_to_charger
    charger_x: 2.2
    charger_y: 0.0
    charger_yaw: 3.1415926
    use_explicit_predock: true
    predock_x: 1.4
    predock_y: -0.08
    predock_yaw: 0.0
    predock_distance_m: 0.8
    origin_x: 0.0
    origin_y: 0.0
    origin_yaw: 0.0
    dock_timeout_s: 180.0
    nav_timeout_s: 120.0
    post_dock_hold_s: 3.0
    run_return_mission: true
    auto_start: true
    start_delay_s: 25.0
    server_wait_timeout_s: 120.0
    nav_retry_on_cancel: true
