# 唯一数据路径配置（单机 / 多机共用）。
# Docker 挂载数据盘：AUTONOMY_DATA_VOLUMES=/mnt/data4t 或 run_autonomy.py --data-volume /mnt/data4t
volume_root: /mnt/data4t

# 可选覆盖（默认由 volume_root 派生：{volume_root}/data、{volume_root}/mp3d）
# data_root: /mnt/data4t/data
# mp3d_root: /mnt/data4t/mp3d

mp3d_default_scene_id: 17DRP5sb8fy

# LeRobot repo id（launch 可覆盖）
collection_repo_id: local/habitat_collection
nav2_repo_id: local/habitat_nav2
