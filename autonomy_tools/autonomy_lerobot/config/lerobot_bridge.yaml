# Habitat + Nav2 topics (see autonomy_simulator/param/habitat.yaml)
lerobot_bridge_node:
  ros__parameters:
    # --- Habitat sensors ---
    rgb_topic: camera/rgb/image_raw
    depth_topic: camera/depth/image_raw
    semantic_topic: camera/semantic/image_raw
    camera_info_topic: camera/rgb/camera_info
    odom_topic: odom
    agent_pose_topic: habitat/agent_pose
    cmd_vel_topic: cmd_vel
    map_topic: map
    pointcloud_topic: semantic_pointcloud

    # --- Nav2 planning ---
    global_plan_topic: plan
    local_plan_topic: transformed_global_plan
    global_costmap_topic: global_costmap/costmap
    local_costmap_topic: local_costmap/costmap

    # --- Recording toggles ---
    use_depth: false
    record_semantic: true
    record_map: true
    record_pointcloud: true
    record_camera_info: true
    record_nav2: true

    image_width: 640
    image_height: 480
    max_path_waypoints: 512
    max_pointcloud_points: 4096

    dataset_repo_id: local/habitat_nav2
    record_fps: 10.0
    task: navigate to goal

    # Video: h264 mp4 under videos/ (streaming_encoding writes mp4 during capture).
    video_vcodec: h264
    streaming_encoding: true
    parallel_video_encoding: true
