# Multi-robot collection — jdrobot / kujiale-compatible LeRobot v3 schema.
# Use /** so parameters apply under namespaces (/robot1/lerobot_bridge_node, …).
# Launch files also pass autonomy_lerobot.collection_params.jdrobot_collection_parameters().
/**:
  ros__parameters:
    dataset_format: jdrobot
    robot_type: jdrobot

    rgb_topic: camera/rgb/image_raw
    depth_topic: camera/depth/image_raw
    camera_info_topic: camera/rgb/camera_info
    odom_topic: odom

    use_depth: true
    record_depth: true
    record_semantic: false
    record_map: false
    record_pointcloud: false
    record_camera_info: true
    record_nav2: false

    image_width: 640
    image_height: 480
    depth_min_m: 0.0
    depth_max_m: 10.0

    dataset_repo_id: local/habitat_collection
    record_fps: 20.0
    task: navigate to goal
    overwrite_dataset: false

    video_vcodec: av1
    streaming_encoding: true
    parallel_video_encoding: true
