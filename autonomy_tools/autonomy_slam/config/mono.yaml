# 单目 SLAM — ROS 2 节点参数（run_slam）
run_slam:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    robot_base_frame: base_link
    camera_frame: camera_frame
    publish_tf: true
    publish_keyframes: true
    publish_tracking_image: true
    publish_map_points: true
    publish_feature_matches: true
    map_points_skip: 2
    odom2d: false
    transform_tolerance: 0.1
    use_message_timestamp: true
    frame_skip: 1
    publish_trajectory: true
    publish_last_pose_when_lost: false
    encoding: ""
